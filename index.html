<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2e7d32">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pedidos por tienda</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="app">
        <header class="app-header">
            <h1>📦 Pedidos por tienda</h1>
            <button id="btnAjustes" class="btn-icon" type="button" title="Configurar columnas" aria-label="Configurar columnas">
                ⚙️
            </button>
        </header>

        <input type="file" id="archivo" accept=".xlsx, .xls" />
        <input id="busquedaTienda" type="text" inputmode="numeric" placeholder="🔎 Buscar tienda (ej. 1109)" />

        <div class="rapidas">
            <button type="button" onclick="setTienda('1109')">1109</button>
            <button type="button" onclick="setTienda('1161')">1161</button>
            <button type="button" onclick="setTienda('3296')">3296</button>
        </div>

        <!-- NUEVO: Botón para abrir el Bottom Sheet -->
        <button id="btnAbrirFiltros" class="btn-filtros" type="button" onclick="abrirFiltros()">
            <span>⚙️ Ajustar Filtros (Fechas y Tipos)</span>
            <span class="icono-despliegue">🔽</span>
        </button>

        <button class="btn-primario" type="button" onclick="generarPedido()">Mostrar pedido</button>

        <div id="resultado"></div>
    </div>

    <!-- NUEVO: Estructura del Bottom Sheet -->
    <div id="bottomSheetOverlay" class="bottom-sheet-overlay" style="display:none;">
        <div id="bottomSheet" class="bottom-sheet">
            <div class="bs-handle"></div>
            <div class="bs-header">
                <h3>Filtros del Pedido</h3>
                <button class="btn-icon small" type="button" onclick="cerrarFiltros()">✕</button>
            </div>
            <div class="bs-content">
                <span class="seccion-titulo">📅 Fechas disponibles</span>
                <div id="listaFechas" class="opciones-lista"></div>

                <span class="seccion-titulo" style="margin-top:20px;">Tipo de producto</span>
                <div id="listaTipos" class="opciones-lista"></div>
                
                <button class="btn-primario" style="margin-top: 25px;" onclick="cerrarFiltros()">Aplicar y Cerrar</button>
            </div>
        </div>
    </div>

    <!-- Modal de ajustes de columnas -->
    <div id="modalAjustes" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>⚙️ Columnas a mostrar</h3>
                <button id="btnCerrarModal" class="btn-icon small" type="button">✕</button>
            </div>
            <p class="modal-desc">Selecciona qué columnas quieres ver en la tabla. Se guardará automáticamente.</p>
            <div id="listaColumnasAjustes" class="opciones-lista modal-lista"></div>
            <div class="modal-acciones">
                <button type="button" class="btn-secundario" onclick="seleccionarPredeterminadas()">Restaurar</button>
                <button type="button" class="btn-primario" id="btnGuardarAjustes">Guardar</button>
            </div>
        </div>
    </div>

    <!-- NUEVO: Contenedor para notificaciones (Toasts) -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
